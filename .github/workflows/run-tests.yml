name: API Automation Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'QA'
        type: choice
        options:
          - QA
          - DEV
          - STAGING

jobs:
  run-tests:
    name: Run API Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

      # Step 1 — Download the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Install Java 17 using Eclipse Temurin distribution
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3 — Cache Maven dependencies to speed up subsequent runs
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      # Step 4 — Pre-download all dependencies so AspectJ agent
      # is available in ~/.m2 before Surefire tries to use it
      - name: Download dependencies
        run: mvn dependency:resolve -q

      # Step 5 — Execute all tests defined in testng.xml
      # Allure raw results are generated under target/allure-results/
      - name: Run tests
        run: mvn clean test

      # Step 6 — Write environment metadata to allure-results
      # Uses the selected environment if triggered manually, defaults to QA
      - name: Create Allure environment file
        if: always()
        run: |
          mkdir -p target/allure-results
          cat > target/allure-results/environment.properties << EOF
          Environment=${{ github.event.inputs.environment || 'QA' }}
          Base.URL=https://restful-booker.herokuapp.com
          Framework=API Automation Framework
          Author=Osiris Montiel Campos
          Java.Version=17
          OS=Ubuntu (GitHub Actions)
          Triggered.By=${{ github.actor }}
          Trigger=${{ github.event_name }}
          EOF

      # Step 7 — Generate the Allure HTML report from the raw results
      - name: Generate Allure Report
        if: always()
        run: mvn allure:report

      # Step 8 — Upload the Allure HTML report as a downloadable artifact
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/
          retention-days: 30

      # Step 9 — Upload raw Allure results as a separate artifact
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/
          retention-days: 30

      # Step 10 — Upload Surefire XML reports as a backup artifact
      - name: Upload surefire results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 30

      # Step 11 — Deploy the Allure HTML report to GitHub Pages
      # Only runs on push to main or manual trigger, not on pull requests
      - name: Deploy Allure Report to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/site/allure-maven-plugin/