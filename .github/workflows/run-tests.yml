# ============================================================
# GitHub Actions — API Test Automation
# Runs automatically on every push or pull request to main
# ============================================================

name: API Automation Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-tests:
    name: Run API Tests
    runs-on: ubuntu-latest

    steps:

      # Step 1 — Download the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3 — Cache Maven dependencies
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      # Step 4 — Run the tests
      - name: Run tests
        run: mvn clean test

		# Step 5 — Generate Allure HTML report
		- name: Generate Allure Report
			if: always()
		    run: mvn allure:report

		# Step 6 — Upload Allure HTML report as artifact
		- name: Upload Allure Report
		 	if: always()
			uses: actions/upload-artifact@v4
			with:
			name: allure-report
			path: target/site/allure-maven-plugin/
			retention-days: 30

		#Step 7 — Keep surefire results también (backup)
		- name: Upload surefire results
			if: always()
			uses: actions/upload-artifact@v4
			with:
			name: surefire-reports
			path: target/surefire-reports/
				 
		# Step 8 — Deploy report to GitHub Pages
		- name: Deploy Allure Report to GitHub Pages
			if: github.ref == 'refs/heads/main'
			uses: peaceiris/actions-gh-pages@v3
			with:
			github_token: ${{ secrets.GITHUB_TOKEN }}
			publish_dir: target/site/allure-maven-plugin/