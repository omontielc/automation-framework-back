# ============================================================
# GitHub Actions — API Test Automation
# Runs automatically on every push or pull request to main
# ============================================================

name: API Automation Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-tests:
    name: Run API Tests
    runs-on: ubuntu-latest

    steps:

      # Step 1 — Download the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3 — Cache Maven dependencies
      # Saves download time on subsequent runs
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      # Step 4 — Run the tests
      - name: Run tests
        run: mvn clean test

      # Step 5 — Upload test results as artifact
      # Available for download in the Actions tab even if tests fail
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/